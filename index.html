<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hanal — Mera Buddy</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- Hamari CSS file ka link -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Sidebar (Default Closed) -->
  <aside id="sidebar" class="collapsed">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/>
          <circle cx="12" cy="12" r="5"/>
          <circle cx="12" cy="12" r="1.5" fill="#0a0b0e"/>
        </svg>
      </div>
      <div class="brand-titles">
        <span class="brand-name">Hanal</span>
        <span class="brand-tagline">Mera Buddy</span>
      </div>
    </div>
    
    <button class="new-chat-btn" onclick="startNewChat()">
      <span>+ New Chat</span>
      <span>⌘N</span>
    </button>

    <div class="chat-history" id="chatHistoryList">
      <div class="history-item active">Current Conversation</div>
    </div>

    <div class="profile-section">
      <div class="profile-info">
        <div class="profile-avatar" id="avatarInitial">G</div>
        <div class="profile-details">
          <span class="profile-email" id="userEmailDisplay">Guest User</span>
          <span class="profile-status" id="userStatus">Local Mode</span>
        </div>
      </div>
      <button class="login-btn" id="authBtn" onclick="handleAuthAction()">Login</button>
    </div>
  </aside>

  <!-- Main Chat Section -->
  <main>
    <header>
      <div class="header-left">
        <button class="sidebar-toggle-btn" onclick="toggleSidebar()" title="Toggle Sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <span class="header-title">Hanal</span>
      </div>

      <div class="status-badge">
        <span class="status-dot"></span>
        Ready
      </div>
    </header>

    <div class="chat-container" id="chatContainer">
      <div class="chat-wrapper" id="chatWrapper">
        <div class="hero" id="heroSection">
          <h1>Tell me buddy</h1>
        </div>
      </div>
    </div>

    <div class="input-dock">
      <div class="input-box-wrapper">
        <textarea id="userInput" rows="1" placeholder="Ask your buddy..." onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
      </div>
    </div>
  </main>

  <!-- Hamari JavaScript file ka link -->
  <script src="app.js"></script>
</body>
</html>
