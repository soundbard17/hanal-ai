<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hanal — Mera Buddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg-dark: #0a0b0e;
      --glass-panel: rgba(22, 24, 30, 0.65);
      --glass-card: rgba(30, 34, 44, 0.45);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-focus: rgba(255, 255, 255, 0.22);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #ffffff;
      --code-bg: rgba(10, 11, 14, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.03) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(255, 255, 255, 0.02) 0%, transparent 40%);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
      padding: 12px;
      gap: 12px;
    }

    /* Floating Liquid Glass Rounded Sidebar */
    aside {
      width: 270px;
      min-width: 270px;
      background: var(--glass-panel);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      z-index: 20;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    /* By Default Closed State */
    aside.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
      border: none !important;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-20px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--glass-border);
    }

    /* Minimalist Bullseye Logo */
    .brand-logo {
      width: 36px;
      height: 36px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
    }

    .brand-logo svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #0a0b0e;
      stroke-width: 2;
    }

    .brand-titles {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #ffffff;
    }

    .brand-tagline {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }

    /* Fully Rounded Pill Button */
    .new-chat-btn {
      margin-top: 16px;
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 12px 18px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
    }

    .new-chat-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--glass-border-focus);
      transform: translateY(-1px);
    }

    .chat-history {
      flex: 1;
      overflow-y: auto;
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      padding: 10px 16px;
      border-radius: 9999px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      background: transparent;
      border: 1px solid transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.2s ease;
    }

    .history-item:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.04);
    }

    .history-item.active {
      color: #ffffff;
      background: var(--glass-card);
      border-color: var(--glass-border);
    }

    /* Profile / Auth Pill Box */
    .profile-section {
      border-top: 1px solid var(--glass-border);
      padding-top: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .profile-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .profile-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      flex-shrink: 0;
    }

    .profile-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .profile-email {
      font-size: 12px;
      font-weight: 500;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 120px;
    }

    .profile-status {
      font-size: 10px;
      color: var(--text-muted);
    }

    .login-btn {
      background: transparent;
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .login-btn:hover {
      color: #ffffff;
      border-color: var(--glass-border-focus);
      background: rgba(255, 255, 255, 0.08);
    }

    /* Main Floating Container */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--glass-panel);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      position: relative;
      height: 100%;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--glass-border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .sidebar-toggle-btn {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sidebar-toggle-btn:hover {
      color: #ffffff;
      border-color: var(--glass-border-focus);
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.05);
    }

    .header-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: #ffffff;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 500;
      background: var(--glass-card);
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .chat-wrapper {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Minimal Hero */
    .hero {
      text-align: center;
      margin-top: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero h1 {
      font-size: 34px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.8px;
    }

    .message {
      display: flex;
      gap: 14px;
      width: 100%;
      line-height: 1.6;
      font-size: 14px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      padding: 14px 20px;
      border-radius: 20px;
      max-width: 82%;
      word-break: break-word;
    }

    .message.user .bubble {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--glass-border);
      color: #ffffff;
      border-bottom-right-radius: 6px;
      white-space: pre-wrap;
    }

    .message.assistant .bubble {
      background: transparent;
      padding-left: 0;
      color: var(--text-main);
    }

    .bubble p {
      margin-bottom: 12px;
    }
    .bubble p:last-child {
      margin-bottom: 0;
    }
    .bubble strong {
      color: #ffffff;
      font-weight: 600;
    }
    .bubble ul, .bubble ol {
      margin-left: 20px;
      margin-bottom: 12px;
    }
    .bubble li {
      margin-bottom: 6px;
    }
    .bubble h1, .bubble h2, .bubble h3 {
      color: #ffffff;
      margin: 16px 0 8px;
      font-weight: 700;
    }
    .bubble code {
      font-family: 'JetBrains Mono', monospace;
      background: var(--code-bg);
      border: 1px solid var(--glass-border);
      padding: 3px 7px;
      border-radius: 6px;
      font-size: 13px;
      color: #f1f5f9;
    }
    .bubble pre {
      background: var(--code-bg);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 14px 18px;
      overflow-x: auto;
      margin: 12px 0;
    }
    .bubble pre code {
      background: none;
      border: none;
      padding: 0;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .avatar.ai {
      background: #ffffff;
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
    }

    .avatar.ai svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #0a0b0e;
      stroke-width: 2;
    }

    /* Floating Pill Input Dock */
    .input-dock {
      padding: 16px 24px 24px;
      display: flex;
      justify-content: center;
    }

    .input-box-wrapper {
      width: 100%;
      max-width: 760px;
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      border-radius: 9999px;
      padding: 8px 10px 8px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      transition: all 0.2s ease;
    }

    .input-box-wrapper:focus-within {
      border-color: var(--glass-border-focus);
      background: rgba(36, 40, 52, 0.55);
    }

    textarea {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 14px;
      resize: none;
      flex: 1;
      max-height: 140px;
      min-height: 22px;
      line-height: 1.5;
    }

    textarea::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      background: #ffffff;
      color: #0a0b0e;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      flex-shrink: 0;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
    }

    .send-btn:hover {
      transform: scale(1.05);
      background: #f1f5f9;
    }

    .cursor-blink {
      display: inline-block;
      width: 6px;
      height: 15px;
      background-color: #ffffff;
      margin-left: 4px;
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    @media (max-width: 768px) {
      body { padding: 0; gap: 0; }
      aside {
        position: fixed;
        left: 12px;
        top: 12px;
        bottom: 12px;
        z-index: 50;
      }
      main { border-radius: 0; border: none; }
    }
  </style>
</head>
<body>

  <!-- Floating Liquid Glass Sidebar (Default Closed) -->
  <aside id="sidebar" class="collapsed">
    <div class="brand">
      <div class="brand-logo">
        <!-- Minimalist Bullseye SVG -->
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/>
          <circle cx="12" cy="12" r="5"/>
          <circle cx="12" cy="12" r="1.5" fill="#0a0b0e"/>
        </svg>
      </div>
      <div class="brand-titles">
        <span class="brand-name">Hanal</span>
        <span class="brand-tagline">Mera Buddy</span>
      </div>
    </div>
    
    <button class="new-chat-btn" onclick="startNewChat()">
      <span>+ New Chat</span>
      <span>⌘N</span>
    </button>

    <div class="chat-history" id="chatHistoryList">
      <div class="history-item active">Current Conversation</div>
    </div>

    <div class="profile-section">
      <div class="profile-info">
        <div class="profile-avatar" id="avatarInitial">G</div>
        <div class="profile-details">
          <span class="profile-email" id="userEmailDisplay">Guest User</span>
          <span class="profile-status" id="userStatus">Local Mode</span>
        </div>
      </div>
      <button class="login-btn" id="authBtn" onclick="handleAuthAction()">Login</button>
    </div>
  </aside>

  <!-- Main Chat Glass Container -->
  <main>
    <header>
      <div class="header-left">
        <button class="sidebar-toggle-btn" onclick="toggleSidebar()" title="Toggle Sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <span class="header-title">Hanal</span>
      </div>

      <div class="status-badge">
        <span class="status-dot"></span>
        Ready
      </div>
    </header>

    <div class="chat-container" id="chatContainer">
      <div class="chat-wrapper" id="chatWrapper">
        <div class="hero" id="heroSection">
          <h1>Tell me buddy</h1>
        </div>
      </div>
    </div>

    <div class="input-dock">
      <div class="input-box-wrapper">
        <textarea id="userInput" rows="1" placeholder="Ask your buddy..." onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
      </div>
    </div>
  </main>

  <script>
    const sidebar = document.getElementById('sidebar');
    const chatWrapper = document.getElementById('chatWrapper');
    const heroSection = document.getElementById('heroSection');
    const userInput = document.getElementById('userInput');
    const chatContainer = document.getElementById('chatContainer');
    const sendBtn = document.getElementById('sendBtn');
    const userEmailDisplay = document.getElementById('userEmailDisplay');
    const userStatus = document.getElementById('userStatus');
    const avatarInitial = document.getElementById('avatarInitial');
    const authBtn = document.getElementById('authBtn');

    let chatHistory = [];
    let currentUser = localStorage.getItem('hanal_user_email') || null;

    function initUser() {
      if (currentUser) {
        userEmailDisplay.innerText = currentUser;
        userStatus.innerText = 'Synced';
        avatarInitial.innerText = currentUser.charAt(0).toUpperCase();
        authBtn.innerText = 'Logout';
        loadUserSavedHistory();
      } else {
        userEmailDisplay.innerText = 'Guest User';
        userStatus.innerText = 'Local Mode';
        avatarInitial.innerText = 'G';
        authBtn.innerText = 'Login';
      }
    }

    function handleAuthAction() {
      if (currentUser) {
        if (confirm("Logout karna chahte hain?")) {
          localStorage.removeItem('hanal_user_email');
          currentUser = null;
          initUser();
          startNewChat();
        }
      } else {
        const email = prompt("Apna email enter karein chat history sync karne ke liye:");
        if (email && email.includes('@')) {
          localStorage.setItem('hanal_user_email', email.trim().toLowerCase());
          currentUser = email.trim().toLowerCase();
          initUser();
        } else if (email) {
          alert("Kripya valid email address enter karein.");
        }
      }
    }

    function saveChatToStorage() {
      if (currentUser && chatHistory.length > 0) {
        localStorage.setItem(`hanal_history_${currentUser}`, JSON.stringify(chatHistory));
      }
    }

    function loadUserSavedHistory() {
      if (!currentUser) return;
      const saved = localStorage.getItem(`hanal_history_${currentUser}`);
      if (saved) {
        try {
          chatHistory = JSON.parse(saved);
          chatWrapper.innerHTML = '';
          if (heroSection) heroSection.style.display = 'none';

          chatHistory.forEach(item => {
            const sender = item.role === 'user' ? 'user' : 'assistant';
            const text = item.parts[0]?.text || '';
            const bubble = appendMessage(sender, '');
            if (sender === 'assistant') {
              bubble.innerHTML = marked.parse(text);
            } else {
              bubble.innerText = text;
            }
          });
        } catch (e) {
          console.error(e);
        }
      }
    }

    // Smooth Toggle for sidebar
    function toggleSidebar() {
      sidebar.classList.toggle('collapsed');
    }

    userInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function startNewChat() {
      chatHistory = [];
      if (currentUser) {
        localStorage.removeItem(`hanal_history_${currentUser}`);
      }
      chatWrapper.innerHTML = '';
      chatWrapper.appendChild(heroSection);
      heroSection.style.display = 'flex';
      userInput.value = '';
      userInput.style.height = 'auto';
      userInput.focus();
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      if (heroSection) heroSection.style.display = 'none';

      appendMessage('user', text);
      chatHistory.push({
        role: 'user',
        parts: [{ text: text }]
      });

      saveChatToStorage();

      userInput.value = '';
      userInput.style.height = 'auto';
      userInput.disabled = true;
      sendBtn.disabled = true;

      const aiBubble = appendMessage('assistant', '');
      const cursor = document.createElement('span');
      cursor.className = 'cursor-blink';
      aiBubble.appendChild(cursor);

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ history: chatHistory })
        });

        if (!response.ok) {
          const errData = await response.json();
          aiBubble.innerText = errData.error || 'Server error occurred.';
          cursor.remove();
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let fullResponse = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          fullResponse += chunk;
          
          aiBubble.innerHTML = marked.parse(fullResponse);
          aiBubble.appendChild(cursor);
          chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        cursor.remove();

        chatHistory.push({
          role: 'model',
          parts: [{ text: fullResponse }]
        });

        saveChatToStorage();

      } catch (err) {
        cursor.remove();
        aiBubble.innerText = 'Network error. Please try again.';
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    function appendMessage(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;

      if (sender === 'assistant') {
        msgDiv.innerHTML = `
          <div class="avatar ai">
            <!-- Bullseye Logo for AI Bubble -->
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"/>
              <circle cx="12" cy="12" r="5"/>
              <circle cx="12" cy="12" r="1.5" fill="#0a0b0e"/>
            </svg>
          </div>
          <div class="bubble">${text}</div>
        `;
      } else {
        msgDiv.innerHTML = `
          <div class="bubble">${text}</div>
        `;
      }

      chatWrapper.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      return msgDiv.querySelector('.bubble');
    }

    initUser();
  </script>
</body>
</html>
