<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hanal — Mera Buddy</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Floating Sidebar (Default Closed) -->
  <aside id="sidebar" class="collapsed">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/>
          <circle cx="12" cy="12" r="5.5"/>
          <circle cx="12" cy="12" r="2.2" fill="#0a0b0e"/>
        </svg>
      </div>
      <div class="brand-titles">
        <span class="brand-name">Hanal</span>
        <span class="brand-tagline">Mera Buddy</span>
      </div>
    </div>
    
    <button class="new-chat-btn" onclick="startNewChat()">
      <span>+ New Chat</span>
      <span>⌘N</span>
    </button>

    <div class="chat-history" id="chatHistoryList">
      <div class="history-item active">Current Conversation</div>
    </div>

    <div class="profile-section">
      <div class="profile-info">
        <div class="profile-avatar" id="avatarInitial">G</div>
        <div class="profile-details">
          <span class="profile-email" id="userEmailDisplay">Guest User</span>
          <span class="profile-status" id="userStatus">Local Mode</span>
        </div>
      </div>
      <button class="login-btn" id="authBtn" onclick="handleAuthAction()">Login</button>
    </div>
  </aside>

  <!-- Main Container -->
  <main>
    <header>
      <div class="header-left">
        <button class="sidebar-toggle-btn" onclick="toggleSidebar()" title="Toggle Sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <span class="header-title">Hanal</span>
      </div>

      <div class="status-badge">
        <span class="status-dot"></span>
        Ready
      </div>
    </header>

    <div class="chat-container" id="chatContainer">
      <div class="chat-wrapper" id="chatWrapper">
        <div class="hero" id="heroSection">
          <h1>Tell me buddy</h1>
        </div>
      </div>
    </div>

    <!-- Message Bar with Action Menu -->
    <div class="input-dock">
      <div class="input-box-wrapper">
        
        <!-- Action Menu Button & Dropdown -->
        <div class="action-menu-container">
          <button class="action-btn" id="actionBtn" onclick="toggleActionMenu(event)" title="Options">
            <svg viewBox="0 0 24 24">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>

          <!-- Floating Options Popup -->
          <div class="action-dropdown" id="actionDropdown">
            <button class="dropdown-item" onclick="triggerFileUpload()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
              </svg>
              <span>Upload Files</span>
            </button>

            <button class="dropdown-item" onclick="selectActionOption('Create Image')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
              </svg>
              <span>Create Image</span>
            </button>

            <button class="dropdown-item" onclick="selectActionOption('Create Video')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="23 7 16 12 23 17 23 7"></polygon>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
              </svg>
              <span>Create Video</span>
            </button>
          </div>

          <!-- Hidden File Input for Upload Files -->
          <input type="file" id="fileUploadInput" style="display: none;" onchange="handleFileSelected(event)" multiple>
        </div>

        <textarea id="userInput" rows="1" placeholder="Ask your buddy..." onkeydown="handleKey(event)"></textarea>
        
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">
          <svg viewBox="0 0 24 24">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
