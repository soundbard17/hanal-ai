<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hanal — Mera Buddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg-main: #121316;
      --bg-sidebar: #18191d;
      --bg-card: #1f2127;
      --border: #2c2e35;
      --border-hover: #3e414b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #ffffff;
      --user-bubble: #262830;
      --code-bg: #0d0e11;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar Transitions & Collapse */
    aside {
      width: 260px;
      min-width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px;
      transition: width 0.25s ease, min-width 0.25s ease, padding 0.25s ease, transform 0.25s ease;
      position: relative;
      z-index: 20;
    }

    aside.collapsed {
      width: 0;
      min-width: 0;
      padding: 0;
      overflow: hidden;
      border-right: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    /* Minimal Geometric Spark Logo */
    .brand-logo {
      width: 32px;
      height: 32px;
      background: #ffffff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #121316;
      flex-shrink: 0;
    }

    .brand-logo svg {
      width: 18px;
      height: 18px;
      fill: #121316;
    }

    .brand-titles {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.2px;
    }

    .brand-tagline {
      font-size: 11px;
      color: var(--text-muted);
    }

    .new-chat-btn {
      margin-top: 14px;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: 0.15s;
    }

    .new-chat-btn:hover {
      background-color: var(--border);
      border-color: var(--border-hover);
    }

    .chat-history {
      flex: 1;
      overflow-y: auto;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      background-color: var(--bg-card);
      border: 1px solid transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item.active {
      color: #ffffff;
      border-color: var(--border);
    }

    /* Profile / Account Section */
    .profile-section {
      border-top: 1px solid var(--border);
      padding-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .profile-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .profile-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #2c2e35;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      flex-shrink: 0;
    }

    .profile-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .profile-email {
      font-size: 12px;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 135px;
    }

    .profile-status {
      font-size: 11px;
      color: var(--text-muted);
    }

    .login-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      transition: 0.15s;
    }

    .login-btn:hover {
      color: #ffffff;
      border-color: var(--border-hover);
    }

    /* Main Area */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background-color: rgba(18, 19, 22, 0.7);
      backdrop-filter: blur(8px);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .sidebar-toggle-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.15s;
    }

    .sidebar-toggle-btn:hover {
      color: #ffffff;
      border-color: var(--border-hover);
      background-color: var(--bg-card);
    }

    .header-title {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
    }

    .status-badge {
      font-size: 12px;
      background-color: var(--bg-card);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: #22c55e;
      border-radius: 50%;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .chat-wrapper {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Minimal Hero */
    .hero {
      text-align: center;
      margin-top: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero h1 {
      font-size: 32px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .message {
      display: flex;
      gap: 14px;
      width: 100%;
      line-height: 1.6;
      font-size: 14px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 82%;
      word-break: break-word;
    }

    .message.user .bubble {
      background-color: var(--user-bubble);
      border: 1px solid var(--border);
      color: #ffffff;
      white-space: pre-wrap;
    }

    .message.assistant .bubble {
      background-color: transparent;
      padding-left: 0;
      color: var(--text-main);
    }

    .bubble p {
      margin-bottom: 12px;
    }
    .bubble p:last-child {
      margin-bottom: 0;
    }
    .bubble strong {
      color: #ffffff;
      font-weight: 600;
    }
    .bubble ul, .bubble ol {
      margin-left: 20px;
      margin-bottom: 12px;
    }
    .bubble li {
      margin-bottom: 6px;
    }
    .bubble h1, .bubble h2, .bubble h3 {
      color: #ffffff;
      margin: 16px 0 8px;
      font-weight: 600;
    }
    .bubble code {
      font-family: 'JetBrains Mono', monospace;
      background-color: var(--code-bg);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      color: #e5e7eb;
    }
    .bubble pre {
      background-color: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      margin: 12px 0;
    }
    .bubble pre code {
      background: none;
      border: none;
      padding: 0;
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .avatar.ai {
      background-color: #ffffff;
      color: #121316;
    }

    .avatar.ai svg {
      width: 16px;
      height: 16px;
      fill: #121316;
    }

    .input-dock {
      padding: 16px 20px 24px;
      display: flex;
      justify-content: center;
    }

    .input-box-wrapper {
      width: 100%;
      max-width: 760px;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .input-box-wrapper:focus-within {
      border-color: #4b5563;
    }

    textarea {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 14px;
      resize: none;
      flex: 1;
      max-height: 160px;
      min-height: 24px;
      line-height: 1.5;
    }

    textarea::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      background-color: #ffffff;
      color: #121316;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
      transition: 0.15s;
    }

    .send-btn:hover {
      background-color: #e5e7eb;
    }

    .cursor-blink {
      display: inline-block;
      width: 5px;
      height: 14px;
      background-color: #ffffff;
      margin-left: 4px;
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Left Sidebar with Collapse & Profile -->
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/>
        </svg>
      </div>
      <div class="brand-titles">
        <span class="brand-name">Hanal</span>
        <span class="brand-tagline">Mera Buddy</span>
      </div>
    </div>
    
    <button class="new-chat-btn" onclick="startNewChat()">
      <span>+ New Chat</span>
    </button>

    <div class="chat-history" id="chatHistoryList">
      <div class="history-item active">Current Conversation</div>
    </div>

    <!-- User Profile & Email Storage -->
    <div class="profile-section">
      <div class="profile-info">
        <div class="profile-avatar" id="avatarInitial">G</div>
        <div class="profile-details">
          <span class="profile-email" id="userEmailDisplay">Guest User</span>
          <span class="profile-status" id="userStatus">Local Mode</span>
        </div>
      </div>
      <button class="login-btn" id="authBtn" onclick="handleAuthAction()">Login</button>
    </div>
  </aside>

  <!-- Main Chat Section -->
  <main>
    <header>
      <div class="header-left">
        <!-- Sidebar Toggle / Minimize Button -->
        <button class="sidebar-toggle-btn" onclick="toggleSidebar()" title="Toggle Sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
        </button>
        <span class="header-title">Hanal</span>
      </div>

      <div class="status-badge">
        <span class="status-dot"></span>
        Ready
      </div>
    </header>

    <div class="chat-container" id="chatContainer">
      <div class="chat-wrapper" id="chatWrapper">
        <div class="hero" id="heroSection">
          <h1>Tell me buddy</h1>
        </div>
      </div>
    </div>

    <div class="input-dock">
      <div class="input-box-wrapper">
        <textarea id="userInput" rows="1" placeholder="Ask your buddy..." onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
      </div>
    </div>
  </main>

  <script>
    const sidebar = document.getElementById('sidebar');
    const chatWrapper = document.getElementById('chatWrapper');
    const heroSection = document.getElementById('heroSection');
    const userInput = document.getElementById('userInput');
    const chatContainer = document.getElementById('chatContainer');
    const sendBtn = document.getElementById('sendBtn');
    const userEmailDisplay = document.getElementById('userEmailDisplay');
    const userStatus = document.getElementById('userStatus');
    const avatarInitial = document.getElementById('avatarInitial');
    const authBtn = document.getElementById('authBtn');

    let chatHistory = [];
    let currentUser = localStorage.getItem('hanal_user_email') || null;

    // Load User Account State on Startup
    function initUser() {
      if (currentUser) {
        userEmailDisplay.innerText = currentUser;
        userStatus.innerText = 'Synced';
        avatarInitial.innerText = currentUser.charAt(0).toUpperCase();
        authBtn.innerText = 'Logout';
        loadUserSavedHistory();
      } else {
        userEmailDisplay.innerText = 'Guest User';
        userStatus.innerText = 'Local Mode';
        avatarInitial.innerText = 'G';
        authBtn.innerText = 'Login';
      }
    }

    function handleAuthAction() {
      if (currentUser) {
        if (confirm("Logout karna chahte hain?")) {
          localStorage.removeItem('hanal_user_email');
          currentUser = null;
          initUser();
          startNewChat();
        }
      } else {
        const email = prompt("Apna email enter karein chat history save rakhne ke liye:");
        if (email && email.includes('@')) {
          localStorage.setItem('hanal_user_email', email.trim().toLowerCase());
          currentUser = email.trim().toLowerCase();
          initUser();
        } else if (email) {
          alert("Kripya valid email address enter karein.");
        }
      }
    }

    function saveChatToStorage() {
      if (currentUser && chatHistory.length > 0) {
        localStorage.setItem(`hanal_history_${currentUser}`, JSON.stringify(chatHistory));
      }
    }

    function loadUserSavedHistory() {
      if (!currentUser) return;
      const saved = localStorage.getItem(`hanal_history_${currentUser}`);
      if (saved) {
        try {
          chatHistory = JSON.parse(saved);
          chatWrapper.innerHTML = '';
          if (heroSection) heroSection.style.display = 'none';

          chatHistory.forEach(item => {
            const sender = item.role === 'user' ? 'user' : 'assistant';
            const text = item.parts[0]?.text || '';
            const bubble = appendMessage(sender, '');
            if (sender === 'assistant') {
              bubble.innerHTML = marked.parse(text);
            } else {
              bubble.innerText = text;
            }
          });
        } catch (e) {
          console.error(e);
        }
      }
    }

    function toggleSidebar() {
      sidebar.classList.toggle('collapsed');
    }

    userInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function startNewChat() {
      chatHistory = [];
      if (currentUser) {
        localStorage.removeItem(`hanal_history_${currentUser}`);
      }
      chatWrapper.innerHTML = '';
      chatWrapper.appendChild(heroSection);
      heroSection.style.display = 'flex';
      userInput.value = '';
      userInput.style.height = 'auto';
      userInput.focus();
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      if (heroSection) heroSection.style.display = 'none';

      // 1. Add User Message
      appendMessage('user', text);
      chatHistory.push({
        role: 'user',
        parts: [{ text: text }]
      });

      saveChatToStorage();

      userInput.value = '';
      userInput.style.height = 'auto';
      userInput.disabled = true;
      sendBtn.disabled = true;

      // 2. Prepare AI Bubble with Vector Logo & Cursor
      const aiBubble = appendMessage('assistant', '');
      const cursor = document.createElement('span');
      cursor.className = 'cursor-blink';
      aiBubble.appendChild(cursor);

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ history: chatHistory })
        });

        if (!response.ok) {
          const errData = await response.json();
          aiBubble.innerText = errData.error || 'Server error occurred.';
          cursor.remove();
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let fullResponse = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          fullResponse += chunk;
          
          aiBubble.innerHTML = marked.parse(fullResponse);
          aiBubble.appendChild(cursor);
          chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        cursor.remove();

        // 3. Save AI response into memory
        chatHistory.push({
          role: 'model',
          parts: [{ text: fullResponse }]
        });

        saveChatToStorage();

      } catch (err) {
        cursor.remove();
        aiBubble.innerText = 'Network error. Please try again.';
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    function appendMessage(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;

      if (sender === 'assistant') {
        msgDiv.innerHTML = `
          <div class="avatar ai">
            <svg viewBox="0 0 24 24"><path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/></svg>
          </div>
          <div class="bubble">${text}</div>
        `;
      } else {
        msgDiv.innerHTML = `
          <div class="bubble">${text}</div>
        `;
      }

      chatWrapper.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      return msgDiv.querySelector('.bubble');
    }

    // Initialize user session on page load
    initUser();
  </script>
</body>
</html>
